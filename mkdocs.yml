site_name: "HALMET: Hat Labs Marine Engine & Tank Interface"
site_url: https://docs.hatlabs.fi/halmet
site_description: Documentation for HALMET, an ESP32-based marine engine and tank sensor interface board
site_author: Hat Labs

repo_url: https://github.com/hatlabs/HALMET
repo_name: hatlabs/HALMET
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/hat_labs_logo.svg
  favicon: assets/hat_labs_logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fi
          name: Suomi
          build: true
          site_name: "HALMET: Hat Labsin moottori- ja tankkimittausliitäntä"
          site_description: HALMETin käyttöopas — ESP32-pohjainen moottori- ja tankkianturien mittauskortti veneisiin
